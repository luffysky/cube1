name: Web tests (Vercel-ready)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: Test and verify web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject high or critical runtime dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix server/api audit --omit=dev --audit-level=high
      - name: Test gameplay and offline rules
        run: npm test
      - name: Verify Identity signer, JWKS and fail-closed policies
        run: npm run test:identity
      - name: Test original arcade MVP rules
        run: node --test tests/arcade/*.test.mjs
      - name: Install API test dependencies
        run: npm --prefix server/api ci --ignore-scripts --no-audit --no-fund
      - name: Build trusted Identity Neon Function (never deploy on push)
        run: node identity/neon/build.mjs
      - name: Validate bundled Identity entry
        run: node --check identity/neon/build/index.mjs
      - name: Test protected management and game API
        run: npm run test:api
      - name: Validate admin console syntax
        run: node --check internal/admin-console/admin.mjs
      - name: Validate multiplayer browser and Worker syntax
        run: |
          node --check dist/games/spinrealm/room-app.mjs
          node --check dist/games/spinrealm/room-client.mjs
          node --check dist/games/spinrealm/rtc-peers.mjs
          node --check realtime/worker.mjs
      - name: Validate static build transformer
        run: node scripts/build-github-pages.mjs --self-test
      - name: Ensure required offline music asset exists
        run: test -s dist/games/spinrealm/audio/music-loop.mp3
      - name: Verify web output without deploying to GitHub Pages
        run: node scripts/build-github-pages.mjs --base=/
