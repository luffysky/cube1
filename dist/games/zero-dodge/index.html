<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1022">
<title>零界閃避 ZERO DODGE | SnowRealm Games</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#162550,#080d1b 74%);color:#eff6ff}
header,main,footer{max-width:1000px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}
a{color:#9bdfff;text-decoration:none}h1{margin:12px 0 8px;font-size:clamp(27px,5vw,42px)}p{color:#bccce5;line-height:1.6}
.layout{display:grid;grid-template-columns:minmax(280px,640px) minmax(200px,1fr);gap:20px;align-items:start}
canvas{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;touch-action:none;background:#091123;border:1px solid #456090;border-radius:18px;box-shadow:0 0 50px #090f25}
.panel{border:1px solid #33476d;background:#111a30dd;border-radius:18px;padding:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:12px;background:#1b2945;border-radius:12px}.stat small{display:block;color:#adc2da}.stat strong{font-size:25px;font-variant-numeric:tabular-nums}
#health{color:#ff729e;font-size:24px}#status{min-height:3.5em}button{background:#7ee8f1;color:#091222;border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:#293b59;color:white}button:disabled{opacity:.5;cursor:not-allowed}
.controls{display:flex;gap:10px;flex-wrap:wrap}#mobilePause{display:none}
footer{font-size:13px;color:#97acc9}kbd{padding:2px 6px;border:1px solid #627799;border-radius:5px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{order:-1}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:8px}.stat strong{font-size:18px}#health{font-size:17px}canvas{max-height:68vh}#mobilePause{display:inline-block}header,main,footer{padding:12px}}
</style></head><body>
<header><a href="/">← SnowRealm Games</a><span>ARCADE / MVP 01</span></header>
<main><h1>零界閃避 <span style="font-size:.42em;color:#7ee8f1">ZERO DODGE</span></h1>
<p>一場 60 秒的生存測試。彈幕每 10 秒升級，只有操作能讓你活到最後。</p>
<div class="layout">
<div><canvas id="arena" width="640" height="720" role="img" aria-label="躲避隕石遊戲，使用方向鍵或 WASD，手機可拖曳藍色飛船"></canvas><button id="mobilePause" class="secondary" type="button">暫停 / 繼續</button></div>
<section class="panel" aria-label="遊戲操作與分數">
<div class="stats"><div class="stat"><small>倒數</small><strong id="timer">60</strong></div>
<div class="stat"><small>分數</small><strong id="score">0</strong></div>
<div class="stat"><small>生命</small><strong id="health">♥♥♥</strong></div>
<div class="stat"><small>本機最佳</small><strong id="best">0</strong></div></div>
<p id="status" role="status" aria-live="polite">準備開局：活過 60 秒！</p>
<div class="controls"><button id="start" type="button">開始挑戰</button><button id="pause" type="button" class="secondary" disabled>暫停</button></div>
<h2>操作</h2><p>電腦：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵移動；空白鍵暫停。</p>
<p>手機：在遊戲畫面上拖曳飛船移動；切換到背景會自動暫停。</p>
<p>目前是<strong>單人離線規則 MVP</strong>，最佳分數只保存在這台裝置；尚未接雲端排名、會員錢包或多人連線。</p>
</section></div></main><footer>© SnowRealm Games · 原創遊戲程式與簡約向量畫面</footer>
<script type="module" src="./game.mjs"></script></body></html>
